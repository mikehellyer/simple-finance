name: Diagnostic (temporary)

on:
  workflow_dispatch:

jobs:
  ssl-probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe HTTPS unfrozen
        run: |
          python3 -c "
          import json, urllib.request
          req = urllib.request.Request('https://api.github.com/repos/mikehellyer/simple-finance/releases/latest', headers={'User-Agent': 'probe'})
          try:
              with urllib.request.urlopen(req, timeout=5) as r:
                  print('UNFROZEN SUCCESS:', json.loads(r.read())['tag_name'])
          except Exception as e:
              print('UNFROZEN FAILED:', type(e).__name__, e)
          "
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build probe
        run: |
          cat > probe.py << 'PYEOF'
          import json, urllib.request
          req = urllib.request.Request('https://api.github.com/repos/mikehellyer/simple-finance/releases/latest', headers={'User-Agent': 'probe'})
          try:
              with urllib.request.urlopen(req, timeout=5) as r:
                  print('FROZEN SUCCESS:', json.loads(r.read())['tag_name'])
          except Exception as e:
              print('FROZEN FAILED:', type(e).__name__, e)
          PYEOF
          pyinstaller --onefile -n probe probe.py
      - name: Run frozen probe
        run: ./dist/probe
